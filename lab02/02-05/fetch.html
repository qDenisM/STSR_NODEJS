<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fetch</title>
  </head>
  <body>
    
    <script>
        fetch("http://localhost:2001/api/name")
          .then((response) => response.text())
          .then((html) => document.body.innerHTML = html)
          .catch((err) => console.log(err));
    </script>
  </body>
</html>
